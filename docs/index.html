<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARDGE Demo Sites</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <!-- Catppuccin 配色（鎖定 commit 628ff26）：系統淺色用 Latte，深色用 Mocha -->
  <link rel="stylesheet" media="(prefers-color-scheme: light)" href="https://cdn.jsdelivr.net/gh/catppuccin/docsify@628ff26/themes/latte/mauve.css">
  <link rel="stylesheet" media="(prefers-color-scheme: dark)" href="https://cdn.jsdelivr.net/gh/catppuccin/docsify@628ff26/themes/mocha/mauve.css">
  <style>
    /* 字級加大 */
    body { font-size: 18px; }
    .markdown-section { font-size: 18px; }
    .markdown-section h1 { font-size: 36px; }
    .markdown-section h2 { font-size: 28px; }
    .sidebar ul li a { font-size: 17px; }
    .app-name-link { font-size: 24px; }
    .search input { font-size: 16px; }
    /* Catppuccin 給 ☰ 按鈕的底色在 vue 版面會拉成長條，改為透明 */
    .sidebar-toggle-button { background-color: transparent !important; }
    /* 左側目錄下方更新時間 */
    .sidebar-updated { margin: 1.2em 0 0; padding: 0.8em 15px 0; border-top: 1px solid var(--surface1); color: var(--overlay1); font-size: 15px; }
  </style>
</head>
<body>
  <div id="app">載入中…</div>
  <script>
    window.$docsify = {
      name: 'ARDGE Demo Sites',
      repo: 'ardge-field/ardge-website-demo',
      loadSidebar: true,
      subMaxLevel: 0,
      auto2top: true,
      externalLinkTarget: '_blank',
      search: {
        placeholder: '搜尋',
        noData: '找不到結果',
        depth: 2
      },
      plugins: [
        function (hook) {
          // 以 _sidebar.md 的 Last-Modified（網站最後部署時間）顯示於左側目錄下方
          var updated = null;
          var pad = function (n) { return String(n).padStart(2, '0'); };
          var render = function () {
            var nav = document.querySelector('.sidebar-nav');
            if (!nav || !updated || nav.querySelector('.sidebar-updated')) return;
            var el = document.createElement('div');
            el.className = 'sidebar-updated';
            el.textContent = '最後更新：' + updated;
            nav.appendChild(el);
          };
          hook.ready(function () {
            fetch('_sidebar.md', { method: 'HEAD', cache: 'no-cache' }).then(function (r) {
              var d = new Date(r.headers.get('Last-Modified'));
              if (isNaN(d)) return;
              updated = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
                ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
              render();
            });
          });
          hook.doneEach(render);
        }
      ]
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
</body>
</html>
