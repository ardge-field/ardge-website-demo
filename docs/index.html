<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARDGE Demo Sites</title>
  <!-- 分頁圖示：內嵌 SVG（哆啦A夢藍圓角方塊＋白色 A），瀏覽器就不會去網域根目錄找 favicon.ico -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230096E0'/><text x='32' y='46' font-family='Arial,sans-serif' font-size='40' font-weight='700' fill='white' text-anchor='middle'>A</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <!-- Catppuccin 配色（鎖定 commit 628ff26）：淺色用 Latte，深色用 Mocha；強調色另以哆啦A夢藍覆寫 -->
  <link id="ctp-light" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/catppuccin/docsify@628ff26/themes/latte/blue.css">
  <link id="ctp-dark" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/catppuccin/docsify@628ff26/themes/mocha/blue.css">
  <script>
    // 深淺色：偏好為 auto / light / dark，存在 localStorage；auto 跟隨系統。於 <head> 執行以避免閃爍
    (function () {
      var KEY = 'ardge-theme';
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var getPref = function () {
        try { var v = localStorage.getItem(KEY); return v === 'light' || v === 'dark' ? v : 'auto'; } catch (e) { return 'auto'; }
      };
      var apply = function () {
        var pref = getPref();
        var theme = pref === 'auto' ? (mq.matches ? 'dark' : 'light') : pref;
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.setAttribute('data-theme-pref', pref);
        document.getElementById('ctp-light').media = theme === 'light' ? 'all' : 'not all';
        document.getElementById('ctp-dark').media = theme === 'dark' ? 'all' : 'not all';
        document.querySelectorAll('.theme-switch button').forEach(function (b) {
          b.setAttribute('aria-pressed', String(b.dataset.pref === pref));
        });
      };
      window.ardgeTheme = {
        apply: apply,
        set: function (pref) {
          try { pref === 'auto' ? localStorage.removeItem(KEY) : localStorage.setItem(KEY, pref); } catch (e) {}
          apply();
        }
      };
      if (mq.addEventListener) mq.addEventListener('change', apply);
      apply();
    })();
  </script>
  <script>
    // 驗證碼閘門：碼為瀏覽器本地時間的 MMDD（載入當下計算）。僅擋一般訪客，並非安全機制
    // 通過後寫入工作階段 cookie（不設到期），關閉瀏覽器或按「登出」後需重新輸入
    (function () {
      var COOKIE = 'ardge_pass';
      var path = location.pathname.replace(/[^/]*$/, '');
      var secure = location.protocol === 'https:' ? '; Secure' : '';
      var now = new Date();
      var code = String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0');
      var root = document.documentElement;
      var NAME = 'ARDGE Demo Sites';
      window.ardgeGate = {
        // Docsify 以目錄連結的 innerText 組標題；閘門鎖住時目錄隱藏、innerText 為空，會變成「 - ARDGE Demo Sites」
        // unlocked 為 true 表示剛登入：Docsify 不會重設標題，直接改用目前目錄連結的文字
        fixTitle: function (unlocked) {
          if (root.classList.contains('locked')) { document.title = NAME; return; }
          var a = document.querySelector('.sidebar-nav li.active > a');
          if (a && (unlocked || /^\s*-/.test(document.title))) document.title = a.textContent.trim() || NAME;
        },
        logout: function () {
          document.cookie = COOKIE + '=; path=' + path + '; Max-Age=0; SameSite=Lax' + secure;
          location.reload();
        }
      };
      if (document.cookie.split('; ').indexOf(COOKIE + '=1') !== -1) return;
      root.classList.add('locked');
      document.addEventListener('DOMContentLoaded', function () {
        var gate = document.createElement('div');
        gate.className = 'passcode-gate';
        gate.innerHTML =
          '<form class="passcode-box" autocomplete="off">' +
          '<div class="passcode-title">ARDGE Demo Sites</div>' +
          '<label class="passcode-label" for="passcode-input">請輸入驗證碼</label>' +
          '<input id="passcode-input" class="passcode-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" required>' +
          '<button type="submit" class="passcode-btn">登入</button>' +
          '<div class="passcode-error" role="alert" hidden>驗證碼錯誤，請再試一次</div>' +
          '</form>';
        document.body.appendChild(gate);
        var form = gate.querySelector('form');
        var input = gate.querySelector('input');
        var error = gate.querySelector('.passcode-error');
        input.addEventListener('input', function () {
          input.value = input.value.replace(/\D/g, '').slice(0, 4);
          error.hidden = true;
        });
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          if (input.value === code) {
            document.cookie = COOKIE + '=1; path=' + path + '; SameSite=Lax' + secure;
            root.classList.remove('locked');
            gate.remove();
            window.ardgeGate.fixTitle(true);
          } else {
            error.hidden = false;
            input.value = '';
            input.focus();
          }
        });
        input.focus();
      });
    })();
  </script>
  <style>
    /* 哆啦A夢藍：深色用原色 #0096E0；淺色用深一階 #0072B8（對比約 4.5:1） */
    :root[data-theme="light"] { --theme-color: #0072B8 !important; }
    :root[data-theme="dark"]  { --theme-color: #0096E0 !important; }
    /* 驗證碼閘門：未通過前隱藏網站內容 */
    html.locked body > :not(.passcode-gate) { visibility: hidden !important; }
    .passcode-gate { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--base); }
    .passcode-box { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; max-width: 340px; padding: 32px 24px; border: 1px solid var(--surface1); border-radius: 12px; background: var(--mantle); }
    .passcode-title { font-size: 26px; font-weight: 700; color: var(--theme-color); }
    .passcode-label { font-size: 17px; color: var(--subtext1); }
    .passcode-input { width: 9em; padding: 8px 12px; border: 1px solid var(--surface2); border-radius: 8px; background: var(--base); color: var(--text); font: inherit; font-size: 28px; letter-spacing: 0.4em; text-align: center; outline: none; }
    .passcode-input:focus { border-color: var(--theme-color); }
    .passcode-btn { width: 9em; padding: 8px 0; border: 0; border-radius: 8px; background: var(--theme-color); color: var(--base); font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; }
    .passcode-error { color: var(--red); font-size: 15px; }
    /* 字級加大 */
    body { font-size: 18px; }
    .markdown-section { font-size: 18px; }
    .markdown-section h1 { font-size: 36px; }
    .markdown-section h2 { font-size: 28px; }
    .sidebar ul li a { font-size: 17px; }
    .app-name-link { font-size: 24px; }
    .sidebar > h1 { font-weight: 700; }
    .search input { font-size: 16px; }
    /* Catppuccin 給 ☰ 按鈕的底色在 vue 版面會拉成長條，改為透明 */
    .sidebar-toggle-button { background-color: transparent !important; }
    /* 左側目錄下方：深淺色切換、登出、更新日期 */
    .sidebar-footer { margin: 1.2em 0 0; padding: 0.8em 15px 0; border-top: 1px solid var(--surface1); }
    .sidebar-updated { margin-top: 0.8em; color: var(--overlay1); font-size: 15px; }
    .theme-switch { display: inline-flex; border: 1px solid var(--surface1); border-radius: 6px; overflow: hidden; }
    .theme-switch button { padding: 4px 10px; border: 0; background: transparent; color: var(--subtext0); font: inherit; font-size: 14px; cursor: pointer; }
    .theme-switch button + button { border-left: 1px solid var(--surface1); }
    .theme-switch button:hover { color: var(--theme-color); }
    .theme-switch button[aria-pressed="true"] { background: var(--theme-color); color: var(--base); font-weight: 700; }
    .logout-btn { display: block; margin-top: 0.8em; padding: 4px 10px; border: 1px solid var(--surface1); border-radius: 6px; background: transparent; color: var(--subtext0); font: inherit; font-size: 14px; cursor: pointer; }
    .logout-btn:hover { color: var(--theme-color); border-color: var(--theme-color); }
  </style>
</head>
<body>
  <div id="app">載入中…</div>
  <script>
    window.$docsify = {
      name: 'ARDGE Demo Sites',
      repo: 'ardge-field/ardge-website-demo',
      loadSidebar: true,
      subMaxLevel: 0,
      auto2top: true,
      externalLinkTarget: '_blank',
      search: {
        placeholder: '搜尋',
        noData: '找不到結果',
        depth: 2
      },
      plugins: [
        function (hook) {
          // 左側目錄下方：深淺色切換、登出、更新日期（_sidebar.md 的 Last-Modified，即網站最後部署時間）
          var updated = null;
          var pad = function (n) { return String(n).padStart(2, '0'); };
          var render = function () {
            var nav = document.querySelector('.sidebar-nav');
            if (!nav) return;
            var footer = nav.querySelector('.sidebar-footer');
            if (!footer) {
              footer = document.createElement('div');
              footer.className = 'sidebar-footer';
              footer.innerHTML =
                '<div class="theme-switch" role="group" aria-label="深淺色">' +
                '<button type="button" data-pref="auto">💻 自動</button>' +
                '<button type="button" data-pref="light">☀️ 淺色</button>' +
                '<button type="button" data-pref="dark">🌙 深色</button>' +
                '</div>' +
                '<button type="button" class="logout-btn">🚪 登出</button>' +
                '<div class="sidebar-updated"></div>';
              footer.querySelectorAll('.theme-switch button').forEach(function (b) {
                b.addEventListener('click', function () { window.ardgeTheme.set(b.dataset.pref); });
              });
              footer.querySelector('.logout-btn').addEventListener('click', function () { window.ardgeGate.logout(); });
              nav.appendChild(footer);
              window.ardgeTheme.apply();
            }
            var el = footer.querySelector('.sidebar-updated');
            el.textContent = updated ? '更新日期：' + updated : '';
            el.hidden = !updated;
          };
          hook.ready(function () {
            fetch('_sidebar.md', { method: 'HEAD', cache: 'no-cache' }).then(function (r) {
              var d = new Date(r.headers.get('Last-Modified'));
              if (isNaN(d)) return;
              updated = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
                ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
              render();
            });
          });
          hook.doneEach(function () {
            render();
            window.ardgeGate.fixTitle();
          });
        }
      ]
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
</body>
</html>
