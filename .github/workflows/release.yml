# 推送 v* tag 時，打包 docs/ 為 zip 並建立 GitHub Release
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package docs
        run: |
          ZIP="ardge-website-demo-${GITHUB_REF_NAME}.zip"
          (cd docs && zip -r "../${ZIP}" .)
          echo "ZIP=${ZIP}" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${ZIP}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
